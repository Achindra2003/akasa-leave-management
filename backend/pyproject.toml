[project]
name = "akasa-leave"
version = "0.1.0"
description = "Employee Leave Management System API"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "langchain-core>=1.7.6",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary,pool]>=3.3.8",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "pydantic[email]>=2.14.3",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.33",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=26.1.0",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "playwright>=1.64.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs a running Postgres (TEST_DATABASE_URL)"]
