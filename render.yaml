# Render Blueprint (deployment as code). Database: Supabase Postgres (D-017), supplied as
# DATABASE_URL in the Render dashboard (sync: false = secret). Use the SESSION pooler or
# direct connection on port 5432 - NOT the transaction pooler (6543) - and ?sslmode=require.
services:
  - type: web
    name: akasa-leave
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ready
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: LOG_JSON
        value: "true"
      - key: DB_POOL_SIZE        # 4 + 4 overflow + 1 checkpointer = 9 <= Supabase free (15)
        value: "4"
      - key: DB_MAX_OVERFLOW
        value: "4"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_API_KEY
        sync: false
