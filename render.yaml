# Render Blueprint (deployment as code). Database: external Neon Postgres (D-004),
# supplied as DATABASE_URL in the Render dashboard (marked sync: false = secret).
services:
  - type: web
    name: akasa-leave
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ready
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: LOG_JSON
        value: "true"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_API_KEY
        sync: false
